<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Volume+</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <span class="name">Volume+</span>
    </div>
    <span class="host" id="host"></span>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab is-active" id="tab-volume" type="button" role="tab"
            aria-selected="true" aria-controls="view-volume" data-view="volume">Volume</button>
    <button class="tab" id="tab-eq" type="button" role="tab"
            aria-selected="false" aria-controls="view-eq" data-view="eq">Equalizer</button>
    <button class="tab" id="tab-settings" type="button" role="tab"
            aria-selected="false" aria-controls="view-settings" data-view="settings">Settings</button>
  </nav>

  <main class="body">

    <!-- ============================== VOLUME ============================== -->
    <section class="view is-active" id="view-volume" role="tabpanel" aria-labelledby="tab-volume">
      <div class="readout">
        <div class="pct" id="pct">100%</div>
        <div class="meta" id="meta">normal volume</div>
      </div>

      <div class="sliderwrap">
        <input type="range" id="slider" class="slider" min="0" max="600" step="10" value="100"
               aria-label="Tab volume (snaps to 10% steps, Shift+arrows for 1%)"
               aria-valuetext="100 percent">
        <div class="ruler" id="ruler" aria-hidden="true"></div>
      </div>

      <div class="scale" aria-hidden="true">
        <span>0</span><span id="scale100" class="is-clickable">100</span><span>200</span><span>300</span><span>400</span><span>500</span><span>600</span>
      </div>

      <section class="card">
        <div class="card-head">
          <button class="switch" id="bassBtn" type="button" role="switch"
                  aria-checked="false" aria-label="Bass Boost">
            <span class="knob"></span>
          </button>
          <span class="card-name">Bass Boost</span>
          <span class="card-val" id="bassDb">8 dB</span>
        </div>
        <input type="range" id="bassSlider" class="slider sub" min="0" max="12" step="1" value="8"
               aria-label="Bass boost intensity" disabled>
        <div class="card-hint">Low-shelf filter at 180&nbsp;Hz</div>
      </section>
    </section>

    <!-- ============================= EQUALIZER ============================ -->
    <section class="view" id="view-eq" role="tabpanel" aria-labelledby="tab-eq" hidden>
      <section class="card">
        <div class="card-head">
          <button class="switch" id="eqBtn" type="button" role="switch"
                  aria-checked="false" aria-label="Equalizer">
            <span class="knob"></span>
          </button>
          <span class="card-name">Equalizer</span>
          <button class="link" id="eqFlatten" type="button">Flatten</button>
        </div>

        <div class="eq-preset-row" id="eqPresetRow">
          <label class="eq-preset-label" for="eqPreset">Preset</label>
          <select class="eq-preset" id="eqPreset" aria-label="Equalizer preset"><!-- options built by popup.js --></select>
        </div>

        <div class="eq" id="eq"><!-- bands built by popup.js --></div>
        <div class="card-hint">Drag a fader · tap its dB value to zero the band</div>
      </section>
    </section>

    <!-- ============================= SETTINGS ============================= -->
    <section class="view" id="view-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <section class="card">
        <div class="card-head">
          <button class="switch" id="noiseBtn" type="button" role="switch"
                  aria-checked="false" aria-label="Reduce noise">
            <span class="knob"></span>
          </button>
          <span class="card-name">Reduce noise</span>
          <span class="card-val" id="noiseVal">50%</span>
        </div>
        <input type="range" id="noiseSlider" class="slider sub" min="0" max="80" step="1" value="50"
               aria-label="Noise reduction strength (0–80%)" disabled>
        <div class="card-hint">High-pass + de-hiss shelf — trims rumble &amp; hiss</div>
      </section>

      <section class="card info">
        <div class="row"><span>Audio sources</span><span id="engine">—</span></div>
        <div class="row"><span>Boost engine</span><span id="engineRow">—</span></div>
        <div class="row"><span>Slider steps</span><span>10% · Shift+↑↓ for 1%</span></div>
      </section>

      <footer class="foot">
        <button class="link" id="reset" type="button">Reset all</button>
        <span class="ver" id="ver">Volume+</span>
      </footer>
    </section>

  </main>

  <script src="../shared/audio-config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
